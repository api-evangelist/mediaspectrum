description: Mediaspectrum is a cloud-based SaaS provider of multichannel advertising, content
  management, and publishing software for media companies and publishers. Founded in 2001 and
  headquartered in Miami, its platform manages the full advertising lifecycle -- proposal generation,
  packaging, scheduling, rating, workflow, trafficking, optimization, and billing -- alongside an
  integrated CRM and the ContentWatch content management system spanning print, web, mobile, video,
  social, and broadcast channels. The company raised a $35.8M investment from Insight Venture Partners
  in 2013 and counts Gannett, Dow Jones, and Trinity Mirror among its clients. No public API, developer
  portal, or SDKs are published as of this enrichment pass.
